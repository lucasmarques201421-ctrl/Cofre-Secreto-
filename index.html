<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Cofre Secreto - Mágico</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card magic">

    <img src="cadeado.png" class="lock-img">

    <h1>Cofre Secreto</h1>
    <p class="subtitle">Digite o código mágico</p>

    <div class="display">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>

    <div class="keyboard">
        <button onclick="addNumber(1)">1</button>
        <button onclick="addNumber(2)">2</button>
        <button onclick="addNumber(3)">3</button>

        <button onclick="addNumber(4)">4</button>
        <button onclick="addNumber(5)">5</button>
        <button onclick="addNumber(6)">6</button>

        <button onclick="addNumber(7)">7</button>
        <button onclick="addNumber(8)">8</button>
        <button onclick="addNumber(9)">9</button>

        <button onclick="clearCode()">⌫</button>
        <button onclick="addNumber(0)">0</button>
    </div>

    <button class="open-btn" onclick="checkCode()">🪄 Revelar</button>

    <p id="message"></p>

</div>

<div id="magic-screen" class="hidden">
    <div class="magic-box">
        <h2>🪄 Feitiço Revelado</h2>
        <p id="magic-text"></p>
        <button onclick="closeMagic()">Fechar</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
